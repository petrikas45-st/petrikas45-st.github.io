body {
    margin: 0;
    font-family: Arial, sans-serif;

/* HEADER */
header {
    background: #222;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    color: white;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);

nav a {

    font-size: 18px;
    transition: 0.3s;
}

nav a:hover {

    transform: translateY(-2px);
}

/* CONTAINER */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

/* CARD */
.card {
    background: white;
    padding: 25px;
    margin-bottom: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-6px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.2);
}

/* BUTTON */
.button {
    display: inline-block;
    padding: 12px 18px;
    background: #ff7b00;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    margin-top: 10px;
    transition: 0.3s;
}

.button:hover {
    background: #e56f00;
    transform: scale(1.05);
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
